<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img"
     aria-label="THERM icon">
  <title>THERM icon</title>
  <desc>1:1 icon mark derived from the faceted THERM wordmark.</desc>

  <defs>
    <linearGradient id="capTop" x1="0.04" y1="0" x2="0.96" y2="0.9">
      <stop offset="0" stop-color="#d6d6d6"/>
      <stop offset="0.34" stop-color="#8a8a8a"/>
      <stop offset="0.68" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8d8d"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="tip" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#737373"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#ffffff"/>

  <!--
    One silhouette: folded cap + horizontal left arm + blade stem.
    All later facets sit on top of this so joins stay closed.
  -->
  <path fill="#111111" d="
    M 96,88
    L 168,64
    L 448,64
    L 448,148
    L 328,148
    L 328,388
    L 276,456
    L 224,388
    L 224,220
    L 56,228
    L 28,184
    L 56,148
    L 96,148
    Z"/>

  <!-- upper plane of the folded cap -->
  <polygon fill="url(#capTop)"
           points="168,64 448,64 448,148 210,148 132,108"/>

  <!-- left folded return -->
  <polygon fill="url(#fold)"
           points="96,88 168,64 132,108 210,148 96,148"/>

  <!-- cap front edge -->
  <polygon fill="url(#front)"
           points="210,128 448,128 448,148 210,148"/>

  <!-- stem right bevel -->
  <polygon fill="url(#bevel)"
           points="308,148 328,148 328,388 308,376"/>

  <!-- pointed terminal -->
  <polygon fill="url(#tip)"
           points="224,360 328,360 328,388 276,456 224,388"/>
</svg>
