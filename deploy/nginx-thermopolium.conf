# Thermopolium — https://iamai.kg/thermopolium/
#
# Install as /etc/nginx/snippets/thermopolium.conf and add ONE line inside the
# `server { server_name iamai.kg; ... }` block of /etc/nginx/conf.d/iamai.kg.conf:
#
#     include /etc/nginx/snippets/thermopolium.conf;
#
# `^~` matters: it stops the regex locations further down that vhost (the
# /(chain|jobs|status|…|api|…) block and the country-code block) from ever seeing these paths.
# Every /thermopolium/* path is routed here, so nothing can fall through to the
# landing-page `try_files` and answer 200 with HTML (see the iamai.kg gotcha).

location = /thermopolium { return 301 /thermopolium/; }

# JSON API → Node service on 127.0.0.1:3460. The trailing slash on proxy_pass strips /thermopolium,
# so the app sees /api/… exactly as in dev.
location ^~ /thermopolium/api/ {
    proxy_pass http://127.0.0.1:3460/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}

# Vite output is content-hashed: cache it for good.
location ^~ /thermopolium/assets/ {
    alias /var/www/thermopolium/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# The SPA. Unknown paths (/thermopolium/therm, /thermopolium/feed, …) fall back to index.html,
# which must revalidate so a new deploy is picked up immediately.
location ^~ /thermopolium/ {
    alias /var/www/thermopolium/;
    index index.html;
    try_files $uri $uri/ /thermopolium/index.html;
    add_header Cache-Control "no-cache";
}
